<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>
</head>

<body>
    <h1>Login</h1>
    <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" value="user@example.com" name="username" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" value="password" name="password" required><br><br>
        <button type="submit">Login</button>
    </form>
    <div id="tokenDisplay" style="display: none;">
        <h2>User Token:</h2>
        <p id="userToken"></p>

        <h2>API Response:</h2>
        <p id="apiResponse"></p>
        <!-- logout button -->
        <button onclick="localStorage.removeItem('token'); location.reload();">Logout</button>
    </div>

    <script>
        // on document load
        document.addEventListener("DOMContentLoaded", function (event) {
            // Check if user is already logged in
            // If user is already logged in, display user token
            var token = localStorage.getItem('token');
            if (token) {
                document.getElementById("tokenDisplay").style.display = "block";
                document.getElementById("userToken").innerText = "User Token: " + token;

                // fetch data from API users/validatetoken x-auth-token
                fetch('http://localhost:4000/users/validatetoken', {
                    method: 'GET',
                    headers: {
                        'x-auth-token': token,
                    },
                })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Success:', data);
                        document.getElementById("apiResponse").innerText = JSON.stringify(data);
                    })
                    .catch((error) => {
                        console.error('Error:', error);
                    });
            }


        });
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            // Perform login authentication here


            var postData = {
                Username: username,
                Password: password
            };
            fetch('http://localhost:4000/users/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(postData),
            })
                .then(response => response.json())
                .then(data => {
                    // save token to local storage
                    localStorage.setItem('token', data.token);

                    console.log('Success:', data);
                    getuserDetails();
                })
                .catch((error) => {
                    console.error('Error:', error);
                });
        });

        function getuserDetails() {
            // Generate user token logic here
            var token = localStorage.getItem('token');
            fetch('http://localhost:4000/users/validatetoken', {
                method: 'GET',
                headers: {
                    'x-auth-token': token,
                },
            })
                .then(response => response.json())
                .then(data => {
                    console.log('Success:', data);
                    // Assuming successful login, display user token
                    document.getElementById("tokenDisplay").style.display = "block";
                    document.getElementById("userToken").innerText = "User Token: " + token;
                    document.getElementById("apiResponse").innerText = JSON.stringify(data);
                })
                .catch((error) => {
                    console.error('Error:', error);
                });

        }
    </script>
</body>

</html>
