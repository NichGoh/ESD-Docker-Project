<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESTaurant4you</title>

    <!-- Vue.js Version 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {background-color: lightgrey;}
</style>
<body>

    <div id="main">
        <div class="">
            <!-- <img src="./logo.png" class="rounded mx-auto d-block" style = "width: 250px; height: 250px;" alt=""> -->
        </div>
        <nav class="navbar navbar-expand-lg" style="background-color: #ad2b2d;">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active text-white" aria-current="page" href="#">Home</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div style="background-color: lightgrey;">
            <!-- Login Form -->
            <h1 class="text-center">Login</h1>
            <form>
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" placeholder="Enter your username"
                                    v-model="username">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password"
                                    placeholder="Enter your password" v-model="password">
                            </div>
                            <div class="text-center">
                                <button type="button"  class="btn btn-primary" @click="login">Login</button>
                            </div>
                            <br>
                            <div class="text-center">
                                <button type="button"  class="btn btn-primary" @click="register">Register</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>

        </div>


    </div>

    <script>
        const app = Vue.createApp({
            created() {
                    // Check if token exists in local storage
                    const token = localStorage.getItem('token');
                    if (token) {
                        // Perform necessary actions if token exists
                        console.log('Token exists:', token);
                        window.location.href = './profile.html';
                        // Add your code here to handle the token
                    } else {
                        // Perform necessary actions if token does not exist
                        console.log('Token does not exist');
                        // Add your code here to handle the absence of token
                    }
                },
            data() {
                return {
                    username: 'user@example.com',
                    password: 'password'
                }
            },
            methods: {
                register(){
                    window.location.href = './register.html';
                },
                login() {
                    // call the login API
                    console.log(this.username);
                    var postData = {
                        Username: this.username,
                        Password: this.password
                    };
                    // call the login API localhost:4000/login
                    fetch('http://localhost:4000/users/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(postData),
                    })
                        .then(response => response.json())
                        .then(data => {
                            // save token to local storage
                            localStorage.setItem('token', data.token);
                            
                           
                            if (data.token){
                                console.log('Success:', data);
                                window.location.href = './profile.html';
                            }
                            
                        })
                        .catch((error) => {
                            console.error('Error:', error);
                        });

                }
            }
        });
        app.mount('#main');
    </script>
    <script src=""> </script>

</body>

</html>
