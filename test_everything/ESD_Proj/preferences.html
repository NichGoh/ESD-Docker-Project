<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="preferences.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<!-- Vue.js Version 3 CDN -->
<script src="https://cdn.jsdelivr.net/npm/vue@3.0.2/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity='sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC' crossorigin='anonymous'>

<title>Restaurant Preferences</title>
</head>
<body style="background-color: #ad2b2d;">

    <div id="app" class="container-fluid" style="width: 50%;">
        <div class="border border-dark bg-white p-4 my-4 rounded-4" >
            <h6 v-if="newSurvey" style="text-align: center;">This is your first time doing this!</h6>
            <h6 v-else style="text-align: center;">Updating your preferences</h6>
            <h2 class="mb-3" style="text-align: center;">Restaurant Preferences</h2>
            <div style="margin: auto; width: 90%;">
                <form id="surveyForm" class="mx-2" action="home_reco.html">
                    
                    <ul class="list-group mb-3 border border-black">
                        <li class="list-group-item list-group-item-danger">
                            <div class="d-inline" style="margin-right: 5px;">
                                <img src="https://cdn-icons-png.flaticon.com/512/1144/1144262.png" width="30" height="30">
                            </div>
                            <div class="d-inline align-middle">
                                Select your preferred restaurant cuisine(s):
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_cuisine" type="radio" value="Italian" id="italianRadio" v-model="pref_cuisine">
                                <label class="form-check-label" for="italianRadio">Italian</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_cuisine" type="radio" value="Western" id="westernRadio" v-model="pref_cuisine">
                                <label class="form-check-label" for="westernRadio">Western</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_cuisine" type="radio" value="Japanese" id="japaneseRadio" v-model="pref_cuisine">
                                <label class="form-check-label" for="japaneseRadio">Japanese</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_cuisine" type="radio" value="Chinese" id="chineseRadio" v-model="pref_cuisine">
                                <label class="form-check-label" for="chineseRadio">Chinese</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_cuisine" type="radio" value="Indian" id="indianRadio" v-model="pref_cuisine">
                                <label class="form-check-label" for="indianRadio">Indian</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_cuisine" type="radio" value="German" id="germanRadio" v-model="pref_cuisine">
                                <label class="form-check-label" for="germanRadio">German</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_cuisine" type="radio" value="Thai" id="thaiRadio" v-model="pref_cuisine">
                                <label class="form-check-label" for="thaiRadio">Thai</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_cuisine" type="radio" value="Spanish" id="spanishRadio" v-model="pref_cuisine">
                                <label class="form-check-label" for="spanishRadio">Spanish</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_cuisine" type="radio" value="Korean" id="koreanRadio" v-model="pref_cuisine">
                                <label class="form-check-label" for="koreanRadio">Korean</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_cuisine" type="radio" value="French" id="frenchRadio" v-model="pref_cuisine">
                                <label class="form-check-label" for="frenchRadio">French</label>
                            </div>
                        </li>
                    </ul>

                    <ul class="list-group mb-3 border border-black">
                        <li class="list-group-item list-group-item-danger">
                            <div class="d-inline" style="margin-right: 5px;">
                                <img src="https://cdn-icons-png.flaticon.com/256/13080/13080040.png" width="30" height="30">
                            </div>
                            <div class="d-inline align-middle">
                                Select your preferred price range(s):
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_price" type="radio" value="0" id="freeRadio" v-model="pref_price">
                                <label class="form-check-label" for="freeRadio">0 - Free</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_price" type="radio" value="1" id="inexpensiveRadio" v-model="pref_price">
                                <label class="form-check-label" for="inexpensiveRadio">1 - Inexpensive</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_price" type="radio" value="2" id="moderateRadio" v-model="pref_price">
                                <label class="form-check-label" for="moderateRadio">2 - Moderate</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_price" type="radio" value="3" id="expensiveRadio" v-model="pref_price">
                                <label class="form-check-label" for="expensiveRadio">3 - Expensive</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_price" type="radio" value="4" id="veryExpensiveRadio" v-model="pref_price">
                                <label class="form-check-label" for="veryExpensiveRadio">4 - Very Expensive</label>
                            </div>
                        </li>
                    </ul> 

                    <ul class="list-group mb-3 border border-black">
                        <li class="list-group-item list-group-item-danger">
                            <div class="d-inline" style="margin-right: 5px;">
                                <img src="https://cdn-icons-png.flaticon.com/512/562/562022.png" width="30" height="30">
                            </div>
                            <div class="d-inline align-middle">
                                Select your preferred location(s):
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_location" type="radio" value="north" id="northRadio" v-model="pref_location">
                                <label class="form-check-label" for="northRadio">North</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_location" type="radio" value="south" id="southRadio" v-model="pref_location">
                                <label class="form-check-label" for="southRadio">South</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_location" type="radio" value="east" id="eastRadio" v-model="pref_location">
                                <label class="form-check-label" for="eastRadio">East</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_location" type="radio" value="west" id="westRadio" v-model="pref_location">
                                <label class="form-check-label" for="westRadio">West</label>
                            </div>
                        </li>
                        <li class="list-group-item border border-dark-subtle">
                            <div class="form-check">
                                <input class="form-check-input" name="pref_location" type="radio" value="central" id="centralRadio" v-model="pref_location">
                                <label class="form-check-label" for="centralRadio">Central</label>
                            </div>
                        </li>
                    </ul>
                    <button type="submit" class="btn btn-danger rounded-3" v-if="newSurvey" @click="createUserPref">Submit</button>
                    <button type="submit" class="btn btn-danger rounded-3" v-else @click="updateUserPref">Submit</button>
                </form>
            </div>
        </div>
    </div>
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js' integrity='sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM' crossorigin='anonymous'></script>
    <script src="preferences.js"></script>
</body>
</html>
