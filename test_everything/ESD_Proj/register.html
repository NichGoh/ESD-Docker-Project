<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESTaurant4you</title>

    <!-- Vue.js Version 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {background-color: lightgrey;}
</style>
<body>

    <div id="main">
        <div class="">
            <!-- <img src="./logo.png" class="rounded mx-auto d-block" style = "width: 250px; height: 250px;" alt=""> -->
        </div>
        <nav class="navbar navbar-expand-lg" style="background-color: #ad2b2d;">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active text-white" aria-current="page" href="#">Home</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div style="background-color: lightgrey;">
            <!-- Login Form -->
            <h1 class="text-center">Register</h1>
            <form>
                <div class="container">
                    <div class="row justify-content-center">
                        <!-- USER DATA -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="userData.Username"
                                    placeholder="Enter your username" v-model="userData.Username">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="userData.Password"
                                    placeholder="Enter your password" v-model="userData.Password">
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="userData.Name" placeholder="Enter your name"
                                    v-model="userData.Name">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="userData.Email"
                                    placeholder="Enter your email" v-model="userData.Email">
                            </div>
                            <div class="mb-3">
                                <label for="userType" class="form-label">User Type</label>
                                <select class="form-select" id="userData.UserType" v-model="userData.UserType"
                                    title="User Type">
                                    <option value="user">User</option>
                                    <option value="restaurant_owner">Restaurant Owner</option>
                                </select>
                            </div>
                        </div>
                        <!-- RESTUARNT DATA -->
                        <div class="col-md-6" v-if="userData.UserType === 'restaurant_owner'">
                            <div class="mb-3">
                                <div class="mb-3">
                                    <label for="resturantData.Name" class="form-label">Restaurant Name</label>
                                    <input type="text" class="form-control" id="resturantData.Name"
                                        placeholder="Enter Restaurant Name" v-model="resturantData.Name">
                                </div>
                                <div class="mb-3">
                                    <label for="resturantData.Opening_hours" class="form-label">Opening
                                        hours</label>
                                    <input type="text" class="form-control" id="resturantData.Opening_hours"
                                        placeholder="Enter your opening hours" v-model="resturantData.Opening_hours">
                                </div>
                                <div class="mb-3">
                                    <label for="resturantData.Contact" class="form-label">Contact</label>
                                    <input type="text" class="form-control" id="resturantData.Contact"
                                        placeholder="Enter your contact" v-model="resturantData.Contact">
                                </div>
                                <div class="mb-3">
                                    <label for="resturantData.Location" class="form-label">Location</label>
                                    <select class="form-select" id="resturantData.Location"
                                        v-model="resturantData.Location">
                                        <option value="central">Central</option>
                                        <option value="north">North</option>
                                        <option value="south">South</option>
                                        <option value="east">East</option>
                                        <option value="west">West</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="resturantData.Cuisine" class="form-label">Cuisine</label>
                                    <select class="form-select" id="resturantData.Cuisine"
                                        v-model="resturantData.Cuisine">
                                        <option value="Western">Western</option>
                                        <option value="Italian">Italian</option>
                                        <option value="Japanese">Japanese</option>
                                        <option value="Chinese">Chinese</option>
                                        <option value="French">French</option>
                                        <option value="Thai">Thai</option>
                                        <option value="Indian">Indian</option>
                                        <option value="Malay">Malay</option>
                                        <option value="Spanish">Spanish</option>
                                        <option value="Korean">Korean</option>
                                        <option value="Vietnamese">Vietnamese</option>
                                        <option value="German">German</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="resturantData.Title_image" class="form-label">Title
                                        Image</label>
                                    <input type="text" class="form-control" id="resturantData.Title_image"
                                        placeholder="Enter your title image" v-model="resturantData.Title_image">
                                    <div v-if="isvalidimgURL">
                                        <div v-if="imageLoads" class="alert alert-success" role="alert">
                                            Valid Image URL
                                            <img @error="onImageLoadFailure($event)" :src="resturantData.Title_image"
                                                alt="Title Image" class="img-fluid">
                                        </div>
                                        <div v-else class="alert alert-danger" role="alert">
                                            Invalid Image URL
                                        </div>

                                    </div>


                                </div>
                                
                            </div>
                        </div>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn btn-primary" @click="register">Register</button>
                    </div>
                </div>
                
            </form>

        </div>

        <!-- display json data sample  -->
        <div class="container" style="display: none;">
            <div class="row">
                <div class="col-md-6">
                    <!-- display userDa -->
                    <h2>FOR TESTING</h2>
                    <pre>{{ userData }}</pre>
                </div>
                <div class="col-md-6">
                    <h2>Post Resturant DATA</h2>
                    <pre>{{ computedResturantData }}</pre>
                </div>
            </div>
        </div>

    </div>

    <script>
        const app = Vue.createApp({
            created() {

            },
            data() {
                return {
                    userData: {
                        Username: "",
                        Password: "",
                        Name: "",
                        Email: "",
                        UserType: "",
                    },
                    resturantData: {
                        username: "",
                        email: "",
                        Name: "",
                        Opening_hours: "",
                        Location: "",
                        Cuisine: "",
                        Contact: "",
                        Title_image: "",
                        price_level: 0,
                        place_id: ""
                    },
                    imageLoads: true

                }
            },
            computed: {
                computedResturantData() {
                    return {
                        username: this.userData.Username,
                        email: this.userData.Email,
                        Name: this.resturantData.Name,
                        Opening_hours: this.resturantData.Opening_hours,
                        Location: this.resturantData.Location,
                        Cuisine: this.resturantData.Cuisine,
                        Contact: this.resturantData.Contact,
                        Title_image: this.resturantData.Title_image
                    }
                },
                isvalidimgURL() {
                    this.imageLoads = true;
                    return this.resturantData.Title_image != "";
                }

            },
            methods: {
                onImageLoadFailure(event) {
                    this.imageLoads = false;
                }
                ,
                register() {
                    if (this.userData.UserType === 'user') {
                        console.log("user")
                        this.register_user();
                    } else {
                        console.log("resturant owner")
                        this.register_resturant();
                    }
                    
                },
                register_user(){
                    var postData = {
                        userData: this.userData,
                        resturantData: this.resturantData
                    }
                    console.log("Registering user");
                    var postData = this.userData;
                    fetch('http://localhost:4000/users/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(postData)
                    })
                        .then(response => response.json())
                        .then(data => {
                            console.log('Success:', data);
                            alert("User registered successfully");
                            localStorage.setItem('token', data.token);
                            // redirect to profile page
                            window.location.href = "./profile.html";
                        })
                        .catch((error) => {
                            console.error('Error:', error);
                        });
                },
                register_resturant(){
                    var postData = {
                        userData: this.userData,
                        resturantData: this.resturantData
                    }
                    console.log("Registering Resturant");
                    console.log(postData)
                    console.log(JSON.stringify(postData))
                    fetch('http://localhost:4001/addRestaurant', {
                        // fetch('http://localhost:4001/testadd', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(postData)
                    })
                        .then(response => response.json())
                        .then(data => {
                            console.log('Success:', data);
                            alert("resturant registered successfully");
                            if (data.token) {
                                console.log('Success:', data);
                                localStorage.setItem('token', data.token);
                                window.location.href = './profile.html';

                            }
                            else {
                                console.log('Success:', data);
                                window.location.href = './login.html';
                            }
                        })
                        .catch((error) => {
                            console.error('Error:', error);
                        });
                }
            }
        });
        app.mount('#main');
    </script>
    <script src=""> </script>

</body>

</html>
