<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservation Form</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity='sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC'
    crossorigin='anonymous'>
  </head>
  <body>
    <div class="d-flex flex-row">
      <img src="./logo.png" class="rounded d-block" style = "width: 150px; height: 150px; margin-left: 70px;" alt="">
      <h2 class="" style=" display: flex;
      justify-content: center;
      align-items: center; margin-top: 10px;">Restaurant4you</h2>
    </div>
    <nav class="navbar navbar-expand-lg" style="background-color: #ad2b2d;">
      <div class="container-fluid p-0">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" style="color: white; margin-left: 70px;" aria-current="page" href="home_reco.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" style="color: white;" aria-current="page" href="profile.html">Profile</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div style="display:flex;justify-content: center;
    align-items: center;">
    <div style="display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    margin-top: 20px; border: #ad2b2d 10px solid; width: 50%; height:50%; padding: 10px;">
    <h3 style="padding-bottom: 10px;">Make your reservation</h3>
    <form
      id="reservationForm"
      action="http://localhost:5100/make_reservation"
      method="post"
    >
      <p id="RestName" style="font-size:25px; font-weight: bold;"></p>

      <label for="reservation_date">Reservation Date:</label>
      <input
        type="date"
        id="reservation_date"
        name="reservation_date"
        required
      /><br /><br />

      <label for="reservation_time">Reservation Time:</label>
      <input
        type="time"
        id="reservation_time"
        name="reservation_time"
        required
      /><br /><br />

      <label for="num_of_pax">Number of Guests:</label>
      <input
        type="number"
        id="num_of_pax"
        name="num_of_pax"
        min="1"
        required
      /><br /><br />

      <label for="special_requests">Special Requests:</label>
      <textarea
        id="special_requests"
        name="special_requests"
        rows="4"
        cols="50"
      ></textarea
      ><br /><br />

      <input type="submit" value="Submit Reservation" /><br /><br />
      
    </form>
    </div>
    </div>

    <script>
      $(document).ready(function() {
        restaurant_username = localStorage.getItem('restaurant_username')
        console.log(restaurant_username)
        restaurant_name = localStorage.getItem('restaurant_name')
        var token = localStorage.getItem('token');
        $("#RestName").text(restaurant_name)
        fetch('http://localhost:4000/users/validatetoken', {
            method: 'GET',
            headers: {
                'x-auth-token': token,
            },
        })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
                // Assuming successful login, display user token
                user_username =data.data.Username;
                user_email = data.data.Email;
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        
          $('#reservationForm').on('submit', function(e) {
              e.preventDefault();
              console.log(user_username)
              console.log(restaurant_username)
              var formData = {
                  user_username: user_username,
                  user_email: user_email,
                  restaurant_username: restaurant_username, 
                  restaurant_name: restaurant_name,
                  reservation_date: $('#reservation_date').val(),
                  reservation_time: $('#reservation_time').val(),
                  num_of_pax: $('#num_of_pax').val(),
                  special_requests: $('#special_requests').val(), 
              };

              // Proceed with the AJAX call as before
              $.ajax({
                  url: 'http://localhost:5100/make_reservation',
                  type: 'POST',
                  headers:{
                    "Content-Type": "application/json"
                  },
                  data: JSON.stringify(formData),
                  success: function(response) {
                      console.log(response);
                      // Store the response data in sessionStorage
                      sessionStorage.setItem('reservationData', JSON.stringify(response));
                      // var loyaltyPoints = response.data.loyalty_points_result.data.loyalty_points;
                      // alert('Reservation submitted successfully! Updated loyalty points: ' + loyaltyPoints)
                      // Redirect to another page after successful submission
                      window.location.href = "reservation_confirmation_page.html";;
                  },
                  error: function(error) {
                      console.log(error);
                      alert('Error submitting reservation.');
                  }
              });
          });
      });
  </script>
  </body>
</html>
