<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESTaurant4you</title>

    <!-- Vue.js Version 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.0.2/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<style>

.carousel-control-prev-icon {
 background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='%23fff' viewBox='0 0 8 8'%3E%3Cpath d='M5.25 0l-4 4 4 4 1.5-1.5-2.5-2.5 2.5-2.5-1.5-1.5z'/%3E%3C/svg%3E") !important;
}

.carousel-control-next-icon {
  background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='%23fff' viewBox='0 0 8 8'%3E%3Cpath d='M2.75 0l-1.5 1.5 2.5 2.5-2.5 2.5 1.5 1.5 4-4-4-4z'/%3E%3C/svg%3E") !important;
}
</style>
<body >

    <div id="main">
        <div class="">
            <img src="./logo.png" class="rounded mx-auto d-block" style = "width: 250px; height: 250px;" alt="">
        </div>
        <nav class="navbar navbar-expand-lg" style="background-color: lightgray;">
            <div class="container-fluid">
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <a class="nav-link active" style="color: black;" aria-current="page" href="home_reco.html">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link active" style="color: black;" aria-current="page" href="profile.html">Profile</a>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
            <div style="background-color:white;">
            <div class="d-flex justify-content-center">
              <div style="background-color: #ad2b2d ; width: 70%; margin:10px;">
                <div v-if=recodone class="text-center p-4" style="color:white">
                  <h4>
                    Recommended restaurants based on your preferences
                  </h4>
                  <form action="">
                    <a class="btn btn-primary" href="preferences.html" role="button">Update now!!</a>
                  </form>
                </div>
                <div v-else class="text-center p-4" style="color:white">
                  <h4>
                    Want recommended options? 
                  </h4>
                  <form action="">
                    <a class="btn btn-primary" href="preferences.html" role="button">Click here!!</a>
                  </form>
                </div>
                <div id="carouselExample" class="carousel slide" data-bs-ride="carousel"   v-if=recodone>
                  <div class="carousel-inner d-flex justify-content-center " >
                    <div>
                      <reco-component v-for="(x,index) in reco_restaurants" 
                          :class="{ active: index === 0 }"
                          v-bind:name= "x.Name" 
                          v-bind:contact= "x.Contact"
                          v-bind:cuisine= "x.Cuisine"
                          v-bind:operating_hours= "x.Opening_hours"
                          v-bind:image= "x.Title_image"
                          v-bind:location= "x.Location"
                          v-bind:email= "x.email"
                          @click="storeData(x.username)">
                      </reco-component>
                    </div>
                  </div>
                  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                  </button>
                  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                  </button>
                </div>
              </div>
            </div>
            
              <div class="row" v-for="i in Math.ceil(all_restaurants.length/3)">
                  <div class="col-4" v-for="a in all_restaurants.slice((i-1)*3,i*3)">
                      <main-display-component
                          v-bind:name= "a.Name" 
                          v-bind:contact= "a.Contact"
                          v-bind:cuisine= "a.Cuisine"
                          v-bind:operating_hours= "a.Opening_hours"
                          v-bind:image= "a.Title_image"
                          v-bind:location= "a.Location"
                          v-bind:email= "a.email" 
                          v-bind:restaurant_username = "a.username"
                          @click="storeData(a.username)">
                      </main-display-component>
                  </div>
              </div>
    </div>

    <!-- Refer to my own external JS -->
<script src="home_reco.js"></script>
    
</body>
</html>
