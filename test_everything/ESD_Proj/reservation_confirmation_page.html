<!DOCTYPE html>
<html lang="en">
  <head>
    
    <script src="//ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>window.jQuery || document.write('<script src="js/jquery-3.5.1.min.js"><\/script>')</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity='sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC'
    crossorigin='anonymous'>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Confirmation Sent</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #ca6365;
      }
      .container {
        width: 80%;
        margin: 0 auto;
        padding: 20px;
      }
      .content {
        background-color: #fff;
        padding: 20px;
        border-radius: 5px;
      }
      h1 {
        color: #333;
      }
      .btn {
        display: inline-block;
        padding: 10px 20px;
        background-color: #007bff;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
      }
      .btn:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <h1>Your reservation has been confirmed</h1>
        <p>
          We've sent a confirmation email to your address. Kindly check your
          inbox for your reservation details.
        </p>
        <p style="font-weight:bold ;">Current Loyalty Points:</p>
        <p id="VoucherEligible">
          <!-- You are eligible for a promo code for use at the restaurant
            <p class="btn" id="redeemVoucher">Get Promo Code</p> -->
        </p>
        
        <p id="voucher"></p>
        <div style="display:flex;justify-content: center;
        align-items: center;">
        <form action="home_reco.html">
          <button class="home-btn" href="home_reco.html" role="button" style="margin: auto;" >Return to home page</button> 
        </form>
          
        </div>

      </div>
    </div>
  </body>
</html>

<script>
    var username
    
  $(document).ready(function () {
    var reservationData = JSON.parse(sessionStorage.getItem("reservationData"));
    if (reservationData) {
      var loyaltyPoints = reservationData.data.loyalty_points_result.data.loyalty_points;
      username = reservationData.data.reservation_result.data.user_username;
      // Display loyalty points on the page
      
      $('.content p:contains("Current Loyalty Points:")').text('Current Loyalty Points: ' + loyaltyPoints);
      if (loyaltyPoints>5) {
        $("#VoucherEligible").html(`You are eligible for a promo code for use at the restaurant<br><br>
                                    <p class="btn" id="redeemVoucher">Get Promo Code</p>`)
      }

      // Use the data as needed, e.g., display it on the page
      console.log("Loyalty Points:", loyaltyPoints);
      console.log("Username", username)
    }
  });
  $(document).ready(function () {
    $("#redeemVoucher").on("click", function () {
      $.ajax({
        url: "http://localhost:5001/loyalty_record/" + username,
        type: "PUT",
        headers:{
          "Content-Type": "application/json"
        },
        success: function (response) {
          var reservationData = JSON.parse(sessionStorage.getItem("reservationData"));
          var loyaltyPoints = reservationData.data.loyalty_points_result.data.loyalty_points;
          voucherCode = response.data.voucher_code;
          console.log(response)
          console.log(loyaltyPoints)
          console.log(voucherCode)
          $("#voucher").text('Voucher Code: ' + voucherCode)
          loyaltyPoints -= 5
          $('.content p:contains("Current Loyalty Points:")').text('Current Loyalty Points: ' + loyaltyPoints);
          $("#VoucherEligible").html(``)
        },
        error: function (error) {
          console.log(error);
          
        },
      });
    });
  });
</script>
